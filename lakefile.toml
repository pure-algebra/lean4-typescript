name = "typescript"
version = "0.4.1"
description = "TypeScript as a target: first-order syntax, deterministic rendering, the generated-identifier profile, and host pins. No knowledge of any effect system."
license = "MIT"
defaultTargets = ["TypeScript", "TypeScriptTest"]

[[lean_lib]]
name = "TypeScript"
globs = ["TypeScript.*"]

[[lean_lib]]
name = "TypeScriptTest"
globs = ["TypeScriptTest.*"]
